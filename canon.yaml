purpose: |
  Pooler provides a generic, thread-safe pooling facility for reusing expensive-to-create
  objects in Common Lisp applications. The primary use case is connection pooling for
  databases and network resources.

  Key capabilities:
  - Automatic pool item creation on demand
  - Configurable capacity and threshold management
  - Timeout-based pool re-initialization
  - Thread-safe concurrent access
  - Distributed pooling with consistent hashing (new in v1.0)
  - Platform abstraction for SBCL, Allegro, and portable implementations

